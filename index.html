<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoCerro 3D - Visor de Perspectiva y Distancia</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://leafletjs.com/examples/custom-icons/leaf-green.png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Three.js (Librería 3D para la Cúpula Celeste) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-primary: #1a252f;
            --bg-card: #2c3e50;
            --accent: #e67e22;
            --accent-hover: #d35400;
            --text-light: #ecf0f1;
            --text-muted: #bdc3c7;
            --success: #2ecc71;
            --warning: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #111a22;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
        }

        header h1 {
            font-size: 1.1rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #34495e;
            color: var(--text-muted);
        }

        .status-badge.active {
            background-color: var(--success);
            color: #111;
            font-weight: bold;
        }

        /* Modos de alineación (Tabs) */
        .mode-tabs {
            display: flex;
            background-color: #17202a;
            border-bottom: 1px solid #34495e;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            min-width: 75px;
            padding: 8px 4px;
            font-size: 0.7rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background-color: rgba(230, 126, 34, 0.1);
            font-weight: bold;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        /* Panel de alineación / Sensores */
        .sensor-panel {
            background-color: var(--bg-card);
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Contenedor 3D para el Sol */
        #dome-3d-container {
            width: 100%;
            height: 150px;
            background-color: #0d131a;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 1px solid #34495e;
        }

        #dome-canvas {
            width: 100%;
            height: 100%;
        }

        .dome-overlay-info {
            position: absolute;
            top: 5px;
            left: 8px;
            font-size: 0.65rem;
            background: rgba(0,0,0,0.6);
            padding: 3px 6px;
            border-radius: 4px;
            pointer-events: none;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .sensor-card {
            background-color: #1a252f;
            padding: 8px 5px;
            border-radius: 6px;
            border: 1px solid #34495e;
        }

        .sensor-card .label {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .sensor-card .value {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-light);
        }

        /* Controles de Entrada */
        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .input-group label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .input-group input, .input-group select {
            background-color: #1a252f;
            border: 1px solid #34495e;
            color: var(--text-light);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn:active {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #34495e;
        }

        .btn-warning {
            background-color: var(--warning);
            color: #111;
        }

        /* Sección de Cámara */
        .camera-section {
            position: relative;
            background-color: #000;
            width: 100%;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #camera-feed, #captured-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
        }

        #captured-image {
            display: none;
            cursor: crosshair;
        }

        .reticle-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255, 255, 255, 0.6);
        }

        .crosshair {
            width: 40px;
            height: 40px;
            border: 2px dashed rgba(230, 126, 34, 0.8);
            border-radius: 50%;
            position: relative;
        }

        .crosshair::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(230, 126, 34, 0.8);
        }

        .crosshair::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(230, 126, 34, 0.8);
        }

        .target-marker-point {
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2px solid var(--accent);
            background-color: rgba(230, 126, 34, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            box-shadow: 0 0 8px var(--accent);
        }

        /* Sección de Mapa */
        .map-section {
            height: 220px;
            width: 100%;
            position: relative;
            border-top: 2px solid var(--accent);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Toast / Notificaciones */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid var(--accent);
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <header>
        <h1>⛰️ GeoCerro 3D</h1>
        <div id="gps-status" class="status-badge">Buscando GPS...</div>
    </header>

    <!-- Selector de Métodos / Pestañas (Las 4 opciones) -->
    <div class="mode-tabs">
        <button class="tab-btn active" onclick="switchTab('sun3d')">☀️ Sol 3D</button>
        <button class="tab-btn" onclick="switchTab('compass')">🧭 Auto Brújula</button>
        <button class="tab-btn" onclick="switchTab('gpsmove')">🚶 Rumbo GPS</button>
        <button class="tab-btn" onclick="switchTab('manual')">🎛️ Manual</button>
    </div>

    <div class="main-container">
        
        <!-- Panel de Control y Sensores -->
        <div class="sensor-panel">
            
            <!-- PESTAÑA 1: HEMISFERA 3D DEL SOL -->
            <div id="tab-sun3d" class="tab-content active">
                <div id="dome-3d-container">
                    <canvas id="dome-canvas"></canvas>
                    <div class="dome-overlay-info">
                        Sol: <span id="sun-calc-pos" style="color:var(--warning)">--°</span> | Inclinación: <span id="phone-pitch">0°</span>
                    </div>
                </div>
                <div class="controls-row">
                    <button class="btn btn-warning" style="flex:1" onclick="alignWithSun3D()">
                        ☀️ Apuntar al Sol y Fijar Norte
                    </button>
                </div>
            </div>

            <!-- PESTAÑA 2: BRÚJULA AUTOMÁTICA -->
            <div id="tab-compass" class="tab-content">
                <div class="sensor-grid">
                    <div class="sensor-card">
                        <div class="label">Rumbo Brújula</div>
                        <div class="value" id="compass-val">--°</div>
                    </div>
                    <div class="sensor-card">
                        <div class="label">Precisión</div>
                        <div class="value" id="compass-acc">--</div>
                    </div>
                    <div class="sensor-card">
                        <div class="label">Estado</div>
                        <div class="value" style="color:var(--success)" id="compass-status">Sensor OK</div>
                    </div>
                </div>
            </div>

            <!-- PESTAÑA 3: RUMBO GPS (EN MOVIMIENTO) -->
            <div id="tab-gpsmove" class="tab-content">
                <div class="sensor-card" style="padding: 10px;">
                    <div class="label" style="margin-bottom: 5px;">Modo Movimiento</div>
                    <div class="value" id="gps-heading-val" style="font-size:0.8rem; color:var(--warning);">Caminá unos pasos rectos para calcular rumbo por desplazamiento</div>
                </div>
            </div>

            <!-- PESTAÑA 4: ALINEACIÓN MANUAL (EL DESLIZADOR / NÚMERO) -->
            <div id="tab-manual" class="tab-content">
                <div class="controls-row">
                    <div class="input-group">
                        <label>Ajustar Azimut Manual (0° - 360°)</label>
                        <input type="number" id="manual-azimuth" value="0" min="0" max="360" oninput="updateAzimuth(this.value)">
                    </div>
                    <button class="btn btn-secondary" onclick="setQuickNorth(0)">N (0°)</button>
                    <button class="btn btn-secondary" onclick="setQuickNorth(90)">E (90°)</button>
                    <button class="btn btn-secondary" onclick="setQuickNorth(180)">S (180°)</button>
                    <button class="btn btn-secondary" onclick="setQuickNorth(270)">O (270°)</button>
                </div>
            </div>

            <!-- Parámetros Comunes -->
            <div class="sensor-grid">
                <div class="sensor-card">
                    <div class="label">Azimut Activo</div>
                    <div class="value" id="active-azimuth" style="color:var(--accent)">0° (N)</div>
                </div>
                <div class="sensor-card">
                    <div class="label">Lat / Lon</div>
                    <div class="value" id="coords-val" style="font-size:0.7rem">-- , --</div>
                </div>
                <div class="sensor-card">
                    <div class="label">Altitud GPS</div>
                    <div class="value" id="alt-val">-- m</div>
                </div>
            </div>

            <div class="controls-row">
                <div class="input-group">
                    <label>Distancia Est. Objeto (m)</label>
                    <input type="number" id="est-distance" value="1500" step="100" onchange="recalculateTarget()">
                </div>
                <div class="input-group">
                    <label>FOV Cámara (°)</label>
                    <input type="number" id="camera-fov" value="60" step="5">
                </div>
            </div>

        </div>

        <!-- Visor de Cámara y Foto -->
        <div class="camera-section">
            <video id="camera-feed" autoplay playsinline muted></video>
            <img id="captured-image" alt="Captura de cerro" onclick="markTargetOnImage(event)">
            
            <div class="reticle-overlay" id="camera-reticle">
                <div class="crosshair"></div>
                <span style="font-size: 0.65rem; margin-top: 4px;">Apunta al objetivo</span>
            </div>

            <div id="target-point" class="target-marker-point"></div>
        </div>

        <div style="padding: 8px 15px; background: #17202a; display: flex; gap: 8px;">
            <button class="btn btn-secondary" style="flex:1" onclick="toggleCamera()">📷 Abrir / Cambiar Cámara</button>
            <button class="btn" style="flex:1" onclick="capturePhoto()">📸 Tomar Captura</button>
        </div>

        <!-- Mapa Leaflet -->
        <div class="map-section">
            <div id="map"></div>
        </div>

    </div>

    <div id="toast" class="toast">Mensaje de notificación</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- ESTADO GLOBAL ---
        let currentAzimuth = 0;
        let currentPitch = 0;
        let userCoords = { lat: -24.7859, lng: -65.4117, alt: 1187 }; // Default Salta, Arg
        let targetCoords = null;
        let activeTab = 'sun3d';
        
        let map, userMarker, targetMarker, sightLine;
        let videoStream = null;
        let sunAzimuth = 0;
        let sunAltitude = 0;
        let lastPositionForHeading = null;

        // Three.js 3D Variables
        let scene, camera, renderer, sunMesh, phoneArrowMesh;

        // --- INICIALIZACIÓN ---
        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            initGPS();
            initCompass();
            init3DScene();
            calculateSunPosition();
            window.addEventListener('resize', onWindowResize);
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- GESTIÓN DE PESTAÑAS ---
        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabId === 'sun3d') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-sun3d').classList.add('active');
            } else if (tabId === 'compass') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-compass').classList.add('active');
            } else if (tabId === 'gpsmove') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('tab-gpsmove').classList.add('active');
            } else if (tabId === 'manual') {
                document.querySelectorAll('.tab-btn')[3].classList.add('active');
                document.getElementById('tab-manual').classList.add('active');
            }
        }

        // --- MAPA LEAFLET ---
        function initMap() {
            map = L.map('map').setView([userCoords.lat, userCoords.lng], 13);

            L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                maxZoom: 17,
                attribution: 'Map data: &copy; OpenStreetMap, SRTM | Map style: &copy; OpenTopoMap'
            }).addTo(map);

            userMarker = L.marker([userCoords.lat, userCoords.lng]).addTo(map)
                .bindPopup("<b>Tu Posición</b>").openPopup();
        }

        function updateMap() {
            if (!map || !userCoords) return;

            const userLatLng = [userCoords.lat, userCoords.lng];
            userMarker.setLatLng(userLatLng);

            const distMeters = parseFloat(document.getElementById('est-distance').value) || 1500;
            targetCoords = calculateDestinationPoint(userCoords.lat, userCoords.lng, currentAzimuth, distMeters);

            const targetLatLng = [targetCoords.lat, targetCoords.lng];

            if (targetMarker) {
                targetMarker.setLatLng(targetLatLng);
            } else {
                targetMarker = L.marker(targetLatLng, {
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        shadowSize: [41, 41]
                    })
                }).addTo(map).bindPopup("<b>Objetivo Calculado</b>");
            }

            if (sightLine) {
                sightLine.setLatLngs([userLatLng, targetLatLng]);
            } else {
                sightLine = L.polyline([userLatLng, targetLatLng], {
                    color: '#e67e22',
                    weight: 3,
                    dashArray: '6, 8'
                }).addTo(map);
            }

            const bounds = L.latLngBounds([userLatLng, targetLatLng]);
            map.fitBounds(bounds, { padding: [30, 30] });
        }

        // --- GPS Y NAVEGACIÓN ---
        function initGPS() {
            if (!navigator.geolocation) {
                document.getElementById('gps-status').innerText = 'Sin GPS';
                return;
            }

            navigator.geolocation.watchPosition(
                (pos) => {
                    const newLat = pos.coords.latitude;
                    const newLng = pos.coords.longitude;

                    // Cálculo de rumbo en movimiento (GPS Heading)
                    if (lastPositionForHeading && activeTab === 'gpsmove') {
                        const dLat = newLat - lastPositionForHeading.lat;
                        const dLng = newLng - lastPositionForHeading.lng;
                        if (Math.abs(dLat) > 0.00001 || Math.abs(dLng) > 0.00001) {
                            let heading = Math.atan2(dLng, dLat) * 180 / Math.PI;
                            heading = (heading + 360) % 360;
                            updateAzimuth(Math.round(heading));
                            document.getElementById('gps-heading-val').innerText = `Rumbo en movimiento detectado: ${Math.round(heading)}°`;
                        }
                    }
                    lastPositionForHeading = { lat: newLat, lng: newLng };

                    userCoords.lat = newLat;
                    userCoords.lng = newLng;
                    userCoords.alt = pos.coords.altitude || 1100;

                    document.getElementById('gps-status').innerText = 'GPS OK';
                    document.getElementById('gps-status').classList.add('active');
                    document.getElementById('coords-val').innerText = `${userCoords.lat.toFixed(4)}, ${userCoords.lng.toFixed(4)}`;
                    document.getElementById('alt-val').innerText = `${Math.round(userCoords.alt)} m`;

                    calculateSunPosition();
                    updateMap();
                },
                (err) => {
                    document.getElementById('gps-status').innerText = 'Error GPS';
                    showToast("Atención: Usando ubicación estimada");
                },
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
            );
        }

        // --- BRÚJULA Y GIROSCOPIO ---
        function initCompass() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    let heading = e.alpha;
                    if (e.webkitCompassHeading) {
                        heading = e.webkitCompassHeading; // iOS
                    }
                    
                    currentPitch = Math.round(e.beta || 0);
                    document.getElementById('phone-pitch').innerText = `${currentPitch}°`;

                    if (heading !== null && activeTab === 'compass') {
                        updateAzimuth(Math.round(heading));
                        document.getElementById('compass-val').innerText = `${Math.round(heading)}°`;
                        document.getElementById('compass-acc').innerText = e.absolute ? 'Alta' : 'Media';
                    }
                }, true);
            }
        }

        function updateAzimuth(val) {
            currentAzimuth = (parseFloat(val) + 360) % 360;
            document.getElementById('active-azimuth').innerText = `${Math.round(currentAzimuth)}° (${getCardinal(currentAzimuth)})`;
            
            // Sincronizar input manual si está visible
            const manualInput = document.getElementById('manual-azimuth');
            if (manualInput && document.activeElement !== manualInput) {
                manualInput.value = Math.round(currentAzimuth);
            }

            updateMap();
        }

        function setQuickNorth(deg) {
            updateAzimuth(deg);
        }

        function getCardinal(deg) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
            return directions[Math.round(deg / 45) % 8];
        }

        // --- ASTRONOMÍA: CÁLCULO DEL SOL ---
        function calculateSunPosition() {
            const now = new Date();
            const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
            
            const declination = 23.45 * Math.sin((284 + dayOfYear) * Math.PI / 180);
            const hours = now.getHours() + now.getMinutes() / 60;
            const hourAngle = (hours - 12) * 15;

            const latRad = userCoords.lat * Math.PI / 180;
            const decRad = declination * Math.PI / 180;
            const hourRad = hourAngle * Math.PI / 180;

            const sinAlt = Math.sin(latRad) * Math.sin(decRad) + Math.cos(latRad) * Math.cos(decRad) * Math.cos(hourRad);
            sunAltitude = Math.asin(sinAlt) * 180 / Math.PI;

            const cosAz = (Math.sin(decRad) - Math.sin(latRad) * sinAlt) / (Math.cos(latRad) * Math.cos(Math.asin(sinAlt)));
            let az = Math.acos(Math.min(Math.max(cosAz, -1), 1)) * 180 / Math.PI;
            if (hourAngle > 0) az = 360 - az;

            sunAzimuth = Math.round(az);
            document.getElementById('sun-calc-pos').innerText = `${sunAzimuth}° (Alt: ${Math.round(sunAltitude)}°)`;

            update3DSunPosition();
        }

        function alignWithSun3D() {
            updateAzimuth(sunAzimuth);
            showToast(`Brújula calibrada con el Sol a ${sunAzimuth}°`);
        }

        // --- ESCENA 3D (CÚPULA CELESTE) ---
        function init3DScene() {
            const container = document.getElementById('dome-3d-container');
            const canvas = document.getElementById('dome-canvas');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 3);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);

            const domeGeo = new THREE.SphereGeometry(2, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2);
            const domeMat = new THREE.MeshBasicMaterial({ color: 0x34495e, wireframe: true, transparent: true, opacity: 0.3 });
            const domeMesh = new THREE.Mesh(domeGeo, domeMat);
            scene.add(domeMesh);

            const sunGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
            sunMesh = new THREE.Mesh(sunGeo, sunMat);
            scene.add(sunMesh);

            const dirGeo = new THREE.ConeGeometry(0.08, 0.4, 8);
            dirGeo.rotateX(Math.PI / 2);
            const dirMat = new THREE.MeshBasicMaterial({ color: 0xe67e22 });
            phoneArrowMesh = new THREE.Mesh(dirGeo, dirMat);
            scene.add(phoneArrowMesh);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            animate3D();
        }

        function update3DSunPosition() {
            if (!sunMesh) return;
            const phi = (90 - sunAltitude) * Math.PI / 180;
            const theta = (sunAzimuth + 180) * Math.PI / 180;

            sunMesh.position.x = 1.8 * Math.sin(phi) * Math.cos(theta);
            sunMesh.position.y = 1.8 * Math.cos(phi);
            sunMesh.position.z = 1.8 * Math.sin(phi) * Math.sin(theta);
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (phoneArrowMesh) {
                phoneArrowMesh.rotation.y = -currentAzimuth * Math.PI / 180;
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('dome-3d-container');
            if (!container || !renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // --- CÁLCULOS GEOMÉTRICOS ---
        function calculateDestinationPoint(lat, lng, azimuth, distanceMeters) {
            const R = 6371000;
            const brng = azimuth * Math.PI / 180;
            const d = distanceMeters;

            const lat1 = lat * Math.PI / 180;
            const lon1 = lng * Math.PI / 180;

            const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d / R) +
                Math.cos(lat1) * Math.sin(d / R) * Math.cos(brng));

            const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d / R) * Math.cos(lat1),
                Math.cos(d / R) - Math.sin(lat1) * Math.sin(lat2));

            return {
                lat: lat2 * 180 / Math.PI,
                lng: lon2 * 180 / Math.PI
            };
        }

        // --- CÁMARA Y INTERACCIÓN EN LA FOTO ---
        async function toggleCamera() {
            const video = document.getElementById('camera-feed');
            const img = document.getElementById('captured-image');

            img.style.display = 'none';
            video.style.display = 'block';
            document.getElementById('camera-reticle').style.display = 'flex';

            try {
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = videoStream;
            } catch (err) {
                showToast("No se pudo acceder a la cámara nativa");
            }
        }

        function capturePhoto() {
            const video = document.getElementById('camera-feed');
            const img = document.getElementById('captured-image');

            if (!video.srcObject) {
                showToast("Abrí primero la cámara");
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            img.src = canvas.toDataURL('image/jpeg');
            video.style.display = 'none';
            img.style.display = 'block';
            document.getElementById('camera-reticle').style.display = 'none';

            showToast("Foto tomada. Tocá el objeto en la imagen.");
        }

        function markTargetOnImage(event) {
            const img = document.getElementById('captured-image');
            const rect = img.getBoundingClientRect();

            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            const marker = document.getElementById('target-point');
            marker.style.left = `${event.clientX - img.parentElement.getBoundingClientRect().left}px`;
            marker.style.top = `${event.clientY - img.parentElement.getBoundingClientRect().top}px`;
            marker.style.display = 'block';

            const centerX = rect.width / 2;
            const offsetX = clickX - centerX;

            const fov = parseFloat(document.getElementById('camera-fov').value) || 60;
            const degPerPixel = fov / rect.width;
            const angularOffset = offsetX * degPerPixel;

            const adjustedAzimuth = (currentAzimuth + angularOffset + 360) % 360;
            updateAzimuth(adjustedAzimuth);
            showToast(`Objetivo marcado. Desviación: ${Math.round(angularOffset)}°`);
        }

        function recalculateTarget() {
            updateMap();
        }
    </script>
